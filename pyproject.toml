[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xang-mcp-gateway"
version = "0.1.0"
description = "Standalone MCP gateway for the xang1234 stock-screener stack (tool passthrough + candidate-fact enrichment)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
xang-mcp-gateway = "xang_mcp_gateway.__main__:main"

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Greenfield: no ignores until a real convention demands one (document any
# future ignore here with a reason, as in the operator's paperbroker repo).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]